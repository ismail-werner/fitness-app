<title>Tone &amp; Sculpt Split</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700&family=DM+Mono:wght@500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
/* Layout: sticky 3D stage (top on phone, left on desktop); week strip of day tiles, then day-grouped checklist with warm-up notes */
:root{
  --bg:#f3eff1; --surface:#ffffff; --ink:#1d1619; --muted:#6c5f66; --line:#e1d7dc;
  --accent:#a8325c; --accent-soft:#f7e3ea; --stage:#efe6ea; --stage-2:#cdbcc4;
  --done:#2f7d5b; --on-done:#ffffff;
  --f-display:"Archivo Narrow","Arial Narrow",sans-serif;
  --f-body:"DM Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141013; --surface:#1d171b; --ink:#f0e8ec; --muted:#a8989f; --line:#30272c;
  --accent:#f088ad; --accent-soft:#3a1f2b; --stage:#2a2026; --stage-2:#0f0b0d;
  --done:#5fc995; --on-done:#0a1610; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141013; --surface:#1d171b; --ink:#f0e8ec; --muted:#a8989f; --line:#30272c;
  --accent:#f088ad; --accent-soft:#3a1f2b; --stage:#2a2026; --stage-2:#0f0b0d;
  --done:#5fc995; --on-done:#0a1610; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{display:grid;gap:18px;max-width:1180px;margin:0 auto}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:clamp(260px,46vh,480px);border-radius:18px;overflow:hidden;
  background:radial-gradient(110% 85% at 50% 30%,var(--stage),var(--stage-2));border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;display:block}
.cap{position:absolute;left:16px;bottom:14px;right:70px;pointer-events:none;display:grid;gap:2px}
.eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cap h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,36px);line-height:1;text-transform:uppercase;text-wrap:balance}
.cap .sr{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.cap .why{font-size:13px;color:var(--muted)}
.cap .cue{font-size:13px;font-weight:600;color:var(--ink);max-width:46ch}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center}
.hint{font-size:11px;color:var(--muted);padding:4px 8px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.load{position:absolute;left:12px;top:12px;margin:0;padding:6px 10px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font:500 12px var(--f-mono);color:var(--muted)}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
@media (min-width:880px){
  .app{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
  .stage{top:calc(env(safe-area-inset-top,0px) + 12px);height:calc(100vh - 52px);max-height:780px}
}
header{display:grid;gap:10px;padding-top:4px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.sub{margin:0;color:var(--muted)}
.week{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
#prog{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.ghost.arm{border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 10px}
.tile{display:grid;justify-items:center;gap:2px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tile.rest{border-style:dashed}
.tile svg{width:44px;height:44px;transform:rotate(-90deg)}
.tile .trk{stroke:var(--line)} .tile .val{stroke:var(--done);transition:stroke-dashoffset .3s}
.tile b{font-family:var(--f-display);font-size:17px;line-height:1;text-transform:uppercase;font-weight:700;text-align:center}
.tile small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--f-body)}
.filt{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);min-height:30px}
.day{margin-top:18px}
.dh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.dt{display:grid;min-width:0}
.dt h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1;text-transform:uppercase;text-wrap:balance}
.cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.warm{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.warm strong{font-family:var(--f-mono);font-weight:500;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-right:6px}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.row.sel{background:var(--accent-soft)}
.ex{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;align-items:baseline;min-width:0;width:100%;text-align:left;border:0;background:none;color:inherit;padding:9px 0;font:inherit;cursor:pointer}
.nm{font-weight:500;min-width:0}
.ex .why{grid-column:1/-1;font-size:12.5px;color:var(--muted)}
.sel .nm{color:var(--accent)}
.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ex .sr{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=checkbox],.dcheck{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;
  background:var(--surface);display:grid;place-content:center;cursor:pointer;padding:0}
.dcheck{width:30px;height:30px;border-radius:50%}
input[type=checkbox]::after,.dcheck::after{content:"";width:6px;height:11px;border:solid var(--on-done);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
input:checked,.dcheck[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
input:checked::after,.dcheck[aria-pressed="true"]::after{transform:rotate(45deg) scale(1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);margin-top:24px}
@media (max-width:400px){.tile svg{width:36px;height:36px}.tile b{font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D exercise demo">
    <canvas id="cv"></canvas>
    <div class="tools"><span class="hint">Drag to rotate</span><button class="iconbtn" id="play" aria-label="Pause animation">❚❚</button></div>
    <p class="load" id="load">Loading 3D model…</p>
    <div class="cap"><span class="eb" id="capDay"></span><h2 id="capName"></h2><span class="sr" id="capSets"></span><span class="why" id="capWhy"></span><span class="cue" id="capCue"></span></div>
  </section>
  <main>
    <header>
      <h1>Tone &amp; Sculpt</h1>
      <p class="sub">Upper · Lower · Rest · Upper &amp; Core · Lower &amp; Core. Tap an exercise to watch it, tick it when your sets are done.</p>
      <div class="week">
        <span id="prog"></span>
        <button class="ghost" id="reset">New week</button>
        <div class="meter"><i id="bar"></i></div>
      </div>
    </header>
    <div class="tiles" id="tiles" aria-label="Filter by day"></div>
    <input id="q" type="search" placeholder="Filter exercises, e.g. curl" aria-label="Filter exercises" autocomplete="off">
    <div class="filt"><span id="fl">Showing all days</span><button class="ghost" id="all" hidden>Show all days</button></div>
    <div id="list"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const DAYS=[
 {n:1,name:'Upper Body',short:'Upper',focus:'Tone arms & back',warm:'5–10 min elliptical or treadmill, arm circles, dynamic stretches',ex:[
  ['Dumbbell Shoulder Press','3 × 10–12','shoulderPress','Capped shoulders','Sit tall and press up without arching your lower back'],
  ['Lat Pulldown','3 × 10–12','pulldown','Strong, defined upper back','Pull the bar to your upper chest, elbows down and back'],
  ['Dumbbell Bicep Curl','3 × 12','curl','Front of the arms','Pin your elbows to your sides, no swinging'],
  ['Tricep Cable Pushdown','3 × 12–15','pushdown','Firms the back of the arms','Elbows stay tucked, only your forearms move'],
  ['Seated Cable Row','3 × 12','seatedRow','Mid back and posture','Chest up, squeeze your shoulder blades together'],
  ['Plank','3 × 45 s hold','plank','Core stability. Move to forearms once this feels easy','Hands under shoulders, one straight line from head to heels']]},
 {n:2,name:'Lower Body',short:'Lower',focus:'Glutes & legs',warm:'Bodyweight glute bridges 2 × 15, leg swings',ex:[
  ['Goblet Squat','3 × 8–10','goblet','Overall lower body strength','Chest up, knees follow your toes, sit down between your heels'],
  ['Romanian Deadlift','3 × 10–12','rdl','Hamstrings and glutes','Soft knees, push your hips back, keep your back flat'],
  ['Bulgarian Split Squat','3 × 8 / leg','bss','Light dumbbells','Most of your weight on the front leg, drop straight down'],
  ['Leg Press','3 × 12','legPress','Quads and glutes','Lower with control and never lock your knees at the top'],
  ['Hanging Knee Raise','3 × 10–12','kneeRaise','Lower abs','Lift your knees with your abs, no swinging']]},
 {n:3,name:'Rest / Recovery',short:'Rest',focus:'Active recovery',warm:'Take the day off, or walk',ex:[
  ['Brisk Walk','30 min','walk','Optional active recovery','Brisk pace: you can talk, but not sing']]},
 {n:4,name:'Upper & Core',short:'Upper',focus:'Sculpting',warm:'5 min light cardio, arm stretches',ex:[
  ['Dumbbell Lateral Raise','4 × 12–15','lateral','Wider shoulders, leaner-looking arms','Raise to shoulder height, lead with your elbows'],
  ['Assisted Pull-Up','3 × 10','pullup','Or banded lat pulldown','Pull your chest to the bar, lower slowly'],
  ['Incline Dumbbell Press','3 × 10–12','inclineDB','Upper chest','Lower to chest level with wrists over elbows'],
  ['Hammer Curl','3 × 12','hammer','Lower bicep and forearm','Thumbs up, elbows still'],
  ['Overhead DB Tricep Extension','3 × 12','ohDB','Back of the arms','Elbows point up, lower the weight behind your head'],
  ['Cable Woodchopper','3 × 15 / side','chop','Obliques and waistline','Turn through your torso, arms stay long']]},
 {n:5,name:'Lower & Core',short:'Lower',focus:'Core burn',warm:'Dynamic leg stretches',ex:[
  ['Hip Thrust','4 × 10–12','hipThrust','Glutes','Chin tucked, squeeze your glutes hard at the top'],
  ['Walking Lunge','3 × 12 steps / leg','lunge','With dumbbells','Back knee toward the floor, front knee over your ankle'],
  ['Seated Leg Curl','3 × 12','hamCurl','Hamstrings','Pull your heels down and back, return slowly'],
  ['Cable Crunch','3 × 15','crunch','Upper abs','Curl your ribs toward your hips, do not pull with your arms'],
  ['Bicycle Crunch','3 × 20 total','bicycle','Obliques and abs','Slow and controlled, shoulder toward the opposite knee']]}
];
const BY={};DAYS.forEach(d=>d.ex.forEach((e,i)=>BY[`d${d.n}-${i}`]={day:d,name:e[0],sets:e[1],key:e[2],why:e[3],cue:e[4]}));
const KEY='sculpt-split-done';
let done={};try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
let fDay=0,sel=Object.keys(BY).find(id=>!done[id])||'d1-0';
const $=id=>document.getElementById(id), list=$('list'), q=$('q');
const idsOf=d=>d.ex.map((_,i)=>`d${d.n}-${i}`);
const C=2*Math.PI*18;

$('tiles').onclick=e=>{const b=e.target.closest('.tile');if(!b)return;const n=+b.dataset.n;fDay=fDay===n?0:n;render();};
$('all').onclick=()=>{fDay=0;render();};
q.oninput=render;

function render(){
  $('tiles').innerHTML=DAYS.map(d=>{const ids=idsOf(d),n=ids.filter(id=>done[id]).length;
    return `<button class="tile${d.n===3?' rest':''}" data-n="${d.n}" aria-pressed="${fDay===d.n}" aria-label="Day ${d.n} ${d.name}, ${n} of ${ids.length} done"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18" fill="none" stroke-width="5"/><circle class="val" cx="22" cy="22" r="18" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/ids.length)}"${n?'':' opacity="0"'}/></svg><small>Day ${d.n}</small><b>${d.short}</b><small>${n}/${ids.length}</small></button>`}).join('');
  $('fl').textContent=fDay?`Showing Day ${fDay} · ${DAYS[fDay-1].name}`:'Showing all days';$('all').hidden=!fDay;
  const s=q.value.trim().toLowerCase();let h='';
  DAYS.forEach(d=>{
    if(fDay&&fDay!==d.n)return;
    const ids=idsOf(d), shown=ids.filter(id=>!s||BY[id].name.toLowerCase().includes(s));
    if(!shown.length)return;
    const n=ids.filter(id=>done[id]).length, full=n===ids.length;
    h+=`<section class="day"><div class="dh"><button class="dcheck" data-day="${d.n}" aria-pressed="${full}" aria-label="Mark all of Day ${d.n} ${full?'not done':'done'}"></button><div class="dt"><span class="eb">Day ${d.n} · ${d.focus}</span><h3>${d.name}</h3></div><span class="cnt">${n}/${ids.length}</span></div>`;
    h+=`<p class="warm"><strong>${d.n===3?'Plan':'Warm-up'}</strong>${d.warm}</p><ul>`;
    shown.forEach(id=>{const e=BY[id];h+=`<li class="row${sel===id?' sel':''}${done[id]?' done':''}"><input type="checkbox" id="c-${id}" data-id="${id}"${done[id]?' checked':''} aria-label="Done: ${e.name}"><button class="ex" data-id="${id}"><span class="nm">${e.name}</span><span class="sr">${e.sets}</span><span class="why">${e.cue}</span></button></li>`;});
    h+='</ul></section>';});
  list.innerHTML=h||'<p class="empty">No exercises match that filter.</p>';
  const tot=Object.keys(BY).length, c=Object.keys(BY).filter(id=>done[id]).length;
  $('prog').textContent=`${c} / ${tot} done this week`;$('bar').style.width=(c/tot*100)+'%';
}
list.addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?done[id]=1:delete done[id];save();render();});
list.addEventListener('click',e=>{
  const ex=e.target.closest('.ex');if(ex){select(ex.dataset.id);return;}
  const dc=e.target.closest('.dcheck');if(dc){const ids=idsOf(DAYS[dc.dataset.day-1]),full=ids.every(id=>done[id]);
    ids.forEach(id=>full?delete done[id]:done[id]=1);save();render();}
});
let armT;$('reset').onclick=function(){
  if(this.classList.contains('arm')){done={};save();render();clearTimeout(armT);this.classList.remove('arm');this.textContent='New week';return;}
  this.classList.add('arm');this.textContent='Tap again to clear';armT=setTimeout(()=>{this.classList.remove('arm');this.textContent='New week';},3000);
};
function select(id){sel=id;const e=BY[id];
  $('capDay').textContent=`Day ${e.day.n} · ${e.day.name}`;$('capName').textContent=e.name;$('capSets').textContent=e.sets;$('capWhy').textContent=e.why;$('capCue').textContent='Form: '+e.cue;
  list.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.querySelector('.ex').dataset.id===id));
  if(window.setAnim)setAnim(e.key);
}
render();select(sel);

/* ---------- 3D athlete ---------- */
if(!window.THREE){$('stage').insertAdjacentHTML('beforeend','<p class="msg">The 3D viewer could not load. Check your connection; the checklist still works.</p>');}
else{
const D=Math.PI/180, L=(a,b,s)=>a+(b-a)*s, V=(x,y,z)=>new THREE.Vector3(x,y,z), V2=(x,y)=>new THREE.Vector2(x,y);
const cv=$('cv'), stage=$('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
THREE.ColorManagement.legacyMode=false;R.outputEncoding=THREE.sRGBEncoding;
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,.1,50);
scene.add(new THREE.HemisphereLight(0xfff4f8,0x463c42,.75));
const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(2.5,5,3.5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-2.6,right:2.6,top:3,bottom:-1,near:.5,far:14});sun.shadow.bias=-.0006;sun.shadow.radius=4;scene.add(sun);
const rim=new THREE.DirectionalLight(0xffb3cc,.5);rim.position.set(-3,3,-4);scene.add(rim);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
const skin=M(0xd9a887,{roughness:.5}), top=M(0xb2345e,{roughness:.7}), legg=M(0x262a33,{roughness:.75}), shoe=M(0xf4f2f3,{roughness:.6}), sole=M(0xb2345e),
  hair=M(0x2e1d14,{roughness:.85}), steel=M(0x8c94a1,{metalness:.7,roughness:.3}), pad=M(0x2a2629,{roughness:.75}), iron=M(0x5b6170,{metalness:.35,roughness:.4}),
  plateMat=M(0x6f8f86,{roughness:.55}), frameMat=M(0x47404a,{metalness:.5,roughness:.4}), matMat=M(0x7a6b9a,{roughness:.95});
const topD=top.clone();topD.side=THREE.DoubleSide;const leggD=legg.clone();leggD.side=THREE.DoubleSide;
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.1,64),M(0x5a4f56,{roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(2.08,2.14,64),M(0xb2345e));ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);

const G=()=>new THREE.Group();
const sph=(r,mat,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat);m.scale.set(sx,sy,sz);return m};
function smooth(a,t){const x=Math.min(.9999,Math.max(0,t))*(a.length-1),i=Math.floor(x);let f=x-i;f=f*f*(3-2*f);return a[i]+(a[i+1]-a[i])*f}
/* tapered, muscle-shaped segment hanging from its joint; radii sampled top→bottom */
function seg(len,radii,mat,from=0,to=1,caps=true){const pts=[],N=20;
  if(caps)pts.push(V2(0,-to*len-radii[radii.length-1]*.5));
  for(let i=N;i>=0;i--){const t=from+(to-from)*i/N;pts.push(V2(smooth(radii,t),-t*len))}
  if(caps)pts.push(V2(0,-from*len+radii[0]*.5));
  return new THREE.Mesh(new THREE.LatheGeometry(pts,24),mat)}
function limb(parent,pos,l1,l2,r1,r2,ball,mat){
  const a=G();a.position.copy(pos);parent.add(a);a.add(ball,seg(l1,r1,mat));
  const b=G();b.position.y=-l1;a.add(b);b.add(sph(r2[0]*.98,mat),seg(l2,r2,mat));const c=G();c.position.y=-l2;b.add(c);return[a,b,c]}

const root=G();scene.add(root);
root.add(sph(1,legg,.19,.13,.135));
const spine=G();spine.position.y=.03;root.add(spine);
/* hourglass torso: skin midriff, crop top over the chest, high-waist leggings band */
const TP=[[-.04,.125],[.02,.118],[.1,.103],[.18,.112],[.26,.138],[.33,.155],[.39,.165],[.43,.165],[.48,.13],[.51,.06],[.52,0]];
const tr=y=>{for(let i=1;i<TP.length;i++)if(y<=TP[i][0]){const f=(y-TP[i-1][0])/(TP[i][0]-TP[i-1][0]);return TP[i-1][1]+(TP[i][1]-TP[i-1][1])*f}return 0};
const band=(y0,y1,add,mat)=>{const pts=[];for(let i=0;i<=14;i++){const y=y0+(y1-y0)*i/14;pts.push(V2(tr(y)+add,y))}const m=new THREE.Mesh(new THREE.LatheGeometry(pts,28),mat);m.scale.z=.66;return m};

const I=new THREE.Quaternion(),qa=new THREE.Quaternion(),qb=new THREE.Quaternion(),mpA=V(),mpB=V(),rd=V();

  set('Hips',Qr);set('Spine02',qa.copy(Qr).multiply(qb.copy(I).slerp(Qs,1/3)));set('Spine01',qa.copy(Qr).multiply(qb.copy(I).slerp(Qs,2/3)));

}
/* roll the forearm so the palm faces the way the exercise needs: sup = palm toward biceps, pro = away, neu = thumbs leading */
const tw1=V(),tw2=V(),tw3=V(),qt=new THREE.Quaternion();
function twist(n){const side=n.startsWith('Left')?'Left':'Right',info=PN[side];if(!info)return;
  const a=mpB,mode=cur.palm||'neu';
  tw1.copy(info.n).applyQuaternion(qt.copy(DQ[n]).multiply(RQ[side+'Hand']));
  (side==='Left'?elL:elR).getWorldQuaternion(qt);
  if(typeof mode==='function')tw2.copy(mode(side==='Left'));else tw2.set(mode==='neu'?(side==='Left'?-1:1):0,0,mode==='sup'?1:mode==='pro'?-1:0).applyQuaternion(qt);

/* grip anchor at the centre of each palm, found from the hand's own vertices */
const GC=['getX','getY','getZ','getW'];
/* hand rig: palm frame from the hand's own vertices, two added finger joints (knuckles, middle) re-skinned onto the finger vertices,
   and a grip anchor in the palm crease where a handle sits when the fingers close around it */
const FING={};
function mkHand(side,mesh,base){
  const bone=B[side+'Hand'],bi=mesh.skeleton.bones.indexOf(bone),g=mesh.geometry,P=g.attributes.position,SI=g.attributes.skinIndex,SW=g.attributes.skinWeight;
  const m=new THREE.Matrix4().copy(mesh.skeleton.boneInverses[bi]).multiply(mesh.bindMatrix),v=V(),pts=[];
  for(let i=0;i<P.count;i++){let w=0;for(const k of GC)if(SI[k](i)===bi)w+=SW[k](i);if(w>.5){v.fromBufferAttribute(P,i).applyMatrix4(m);pts.push([i,v.clone(),w])}}
  const Lh=Math.max(...pts.map(p=>p[1].y)),c=V();pts.forEach(p=>c.add(p[1]));c.multiplyScalar(1/pts.length);
  let xx=0,xz=0,zz=0;pts.forEach(([,p])=>{const x=p.x-c.x,z=p.z-c.z;xx+=x*x;xz+=x*z;zz+=z*z});
  const f=.5*Math.atan2(2*xz,xx-zz),n=V(-Math.sin(f),0,Math.cos(f));

  const crease=pts.filter(([,p])=>Math.abs(p.y-(yk-.06*Lh))<.07*Lh),cc=V();crease.forEach(([,p])=>cc.add(p));cc.multiplyScalar(1/crease.length);
  const nmax=Math.max(...crease.map(([,p])=>p.dot(n))),wc=(wmin+wmax)/2;
  const F1=new THREE.Bone(),F2=new THREE.Bone();F1.position.set(0,yk,0).addScaledVector(w,wc).addScaledVector(n,cc.dot(n));F2.position.set(0,ym-yk,0);bone.add(F1);F1.add(F2);
  const sm=(a,b,x)=>{const t=Math.min(1,Math.max(0,(x-a)/(b-a)));return t*t*(3-2*t)},fv=[];
  pts.forEach(([i,p])=>{const pw=p.dot(w);if(p.y<yk-.08*Lh||pw<wmin-.02*Lh||pw>wmax+.02*Lh)return;
    const t1=sm(yk-.06*Lh,yk+.04*Lh,p.y),t2=sm(ym-.05*Lh,ym+.04*Lh,p.y);fv.push([i,1-t1,t1*(1-t2),t1*t2])});

  bone.add(a);PN[side]={n};FING[side]={F1,F2,w,fv,bi};return a}
function rigFingers(mesh){
  model.updateMatrixWorld(true);
  const sk=mesh.skeleton,bones=sk.bones.slice(),inv=sk.boneInverses.map(x=>x.clone());
  for(const side of ['Left','Right']){const F=FING[side];[F.F1,F.F2].forEach(b=>{bones.push(b);inv.push(new THREE.Matrix4().copy(b.matrixWorld).invert())});
    F.i1=bones.length-2;F.i2=bones.length-1}
  const SI=mesh.geometry.attributes.skinIndex,SW=mesh.geometry.attributes.skinWeight;
  for(const side of ['Left','Right']){const F=FING[side];F.fv.forEach(([i,h,a,b])=>{SI.setXYZW(i,F.bi,F.i1,F.i2,0);SW.setXYZW(i,h,a,b,0)})}

  const c=cur.wristFwd?[0,0]:(cur.grip||cur.bar||cur.lock||cur.thrustBench)?[78,100]:cur.midDB?[30,45]:[12,18];
  for(const side of ['Left','Right']){const F=FING[side];F.F1.quaternion.setFromAxisAngle(F.w,c[0]*D);F.F2.quaternion.setFromAxisAngle(F.w,c[1]*D)}}
function loadModel(){const sc=document.createElement('script');sc.src='model.js';
  sc.onload=()=>{try{const bin=atob(window.MODEL_GLB),buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);

  sc.onerror=fail;document.head.appendChild(sc)}

function onModel(g){
  model=g.scene;scene.add(model);
  model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false}if(o.isBone)B[o.name]=o});

    mixer=new THREE.AnimationMixer(model);walkAct=mixer.clipAction(clip)}
