<title>5-Day Split Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky 3D stage (top on phone, left on desktop); week strip of day tiles, then day-grouped checklist */
:root{
  --bg:#eceff4; --surface:#ffffff; --ink:#141922; --muted:#5b6474; --line:#d5dae3;
  --accent:#2457c5; --accent-soft:#e1e9fb; --stage:#dfe5ee; --stage-2:#b9c3d1;
  --done:#1d8552; --on-done:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1218; --surface:#161b23; --ink:#e7ebf1; --muted:#97a1b2; --line:#262e3b;
  --accent:#7aa2ff; --accent-soft:#1c2740; --stage:#222a36; --stage-2:#0c1016;
  --done:#47c486; --on-done:#08130d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1218; --surface:#161b23; --ink:#e7ebf1; --muted:#97a1b2; --line:#262e3b;
  --accent:#7aa2ff; --accent-soft:#1c2740; --stage:#222a36; --stage-2:#0c1016;
  --done:#47c486; --on-done:#08130d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{display:grid;gap:18px;max-width:1180px;margin:0 auto}
.stage{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:clamp(260px,46vh,480px);border-radius:18px;overflow:hidden;
  background:radial-gradient(110% 85% at 50% 30%,var(--stage),var(--stage-2));border:1px solid var(--line)}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y;cursor:grab;display:block}
.cap{position:absolute;left:16px;bottom:14px;right:70px;pointer-events:none;display:grid;gap:2px}
.eb{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.cap h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,5vw,36px);line-height:1;text-transform:uppercase;text-wrap:balance}
.cap .sr{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.tools{position:absolute;right:10px;top:10px;display:flex;gap:6px;align-items:center}
.hint{font-size:11px;color:var(--muted);padding:4px 8px}
.iconbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 13px var(--f-body);cursor:pointer}
.msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);padding:20px;text-align:center}
@media (min-width:880px){
  .app{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
  .stage{top:calc(env(safe-area-inset-top,0px) + 12px);height:calc(100vh - 52px);max-height:780px}
}
header{display:grid;gap:10px;padding-top:4px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:46px;line-height:.95;text-transform:uppercase;letter-spacing:.01em}
.sub{margin:0;color:var(--muted)}
.week{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center}
.meter{grid-column:1/-1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--done);transition:width .3s}
#prog{font-family:var(--f-mono);font-size:13px;font-variant-numeric:tabular-nums}
.ghost{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
.ghost.arm{border-color:var(--accent);color:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:18px 0 10px}
.tile{display:grid;justify-items:center;gap:2px;padding:10px 4px 8px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);cursor:pointer;font:inherit;min-width:0}
.tile[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.tile svg{width:44px;height:44px;transform:rotate(-90deg)}
.tile .trk{stroke:var(--line)} .tile .val{stroke:var(--done);transition:stroke-dashoffset .3s}
.tile b{font-family:var(--f-display);font-size:18px;line-height:1;text-transform:uppercase;font-weight:700}
.tile small{font-family:var(--f-mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:15px var(--f-body)}
.filt{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted);min-height:30px}
.day{margin-top:18px}
.dh{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.dt{display:grid}
.dt h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase}
.cnt{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;padding:4px 6px;border-bottom:1px solid var(--line);border-radius:8px}
.row.sel{background:var(--accent-soft)}
.ex{display:flex;justify-content:space-between;gap:12px;align-items:baseline;min-width:0;width:100%;text-align:left;border:0;background:none;color:inherit;padding:10px 0;font:inherit;cursor:pointer}
.nm{font-weight:500;min-width:0}
.sel .nm{color:var(--accent)}
.done .nm{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.ex .sr{font-family:var(--f-mono);font-size:13px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
input[type=checkbox],.dcheck{appearance:none;-webkit-appearance:none;margin:0;width:24px;height:24px;border:2px solid var(--muted);border-radius:6px;
  background:var(--surface);display:grid;place-content:center;cursor:pointer;padding:0}
.dcheck{width:30px;height:30px;border-radius:50%}
input[type=checkbox]::after,.dcheck::after{content:"";width:6px;height:11px;border:solid var(--on-done);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);margin-top:-3px;transition:transform .15s}
input:checked,.dcheck[aria-pressed="true"]{background:var(--done);border-color:var(--done)}
input:checked::after,.dcheck[aria-pressed="true"]::after{transform:rotate(45deg) scale(1)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.empty{color:var(--muted);margin-top:24px}
@media (max-width:400px){.tile svg{width:36px;height:36px}.tile b{font-size:15px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <section class="stage" id="stage" aria-label="3D exercise demo">
    <canvas id="cv"></canvas>
    <div class="tools"><span class="hint">Drag to rotate</span><button class="iconbtn" id="play" aria-label="Pause animation">❚❚</button></div>
    <div class="cap"><span class="eb" id="capDay"></span><h2 id="capName"></h2><span class="sr" id="capSets"></span></div>
  </section>
  <main>
    <header>
      <h1>5-Day Split</h1>
      <p class="sub">Push · Pull · Legs · Upper · Lower. Tap an exercise to watch it, tick it when your sets are done.</p>
      <div class="week">
        <span id="prog"></span>
        <button class="ghost" id="reset">New week</button>
        <div class="meter"><i id="bar"></i></div>
      </div>
    </header>
    <div class="tiles" id="tiles" aria-label="Filter by day"></div>
    <input id="q" type="search" placeholder="Filter exercises, e.g. curl" aria-label="Filter exercises" autocomplete="off">
    <div class="filt"><span id="fl">Showing all days</span><button class="ghost" id="all" hidden>Show all days</button></div>
    <div id="list"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<script>
const DAYS=[
 {n:1,name:'Push',ex:[['Incline DB Press','3 × 6–8','inclineDB'],['Machine Chest Press','3 × 8–10','chestPress'],['Shoulder Press','2 × 8–10','shoulderPress'],['Lateral Raise','3 × 10–15','lateral'],['Overhead Rope Ext','2 × 10–15','ohExt'],['Tricep Pushdown','2 × 12–15','pushdown']]},
 {n:2,name:'Pull',ex:[['Assisted Pullups','2 × 6–10','pullup'],['Lat Pulldown','3 × 6–10','pulldown'],['Chest Supported Row','3 × 8–10','csRow'],['DB Rear Delt Fly','3 × 10–15','rearFly'],['Incline DB Curl','3 × 10–15','inclineCurl']]},
 {n:3,name:'Legs',ex:[['Hamstring Curl','3 × 12–15','hamCurl'],['Leg Extension','3 × 12–15','legExt'],['Leg Press','3 × 6–10','legPress'],['Romanian Deadlift','3 × 8–10','rdl']]},
 {n:4,name:'Upper',ex:[['Incline Smith Press','3 × 6–10','smith'],['Lat Pulldown','3 × 8–10','pulldown'],['Pec Deck Fly','2 × 10–15','pecDeck'],['DB Lateral Raises','3 × 10–12','lateral'],['Cable Curl + Straight Bar Pushdown','2–3 × 12–15','curlPush']]},
 {n:5,name:'Lower',ex:[['Smith Squat','3 × 6–10','squat'],['Bulgarian Split Squat','3 × 8–10 / leg','bss'],['Hamstring Curl','3 × 10–12','hamCurl'],['Standing Calf Raise','3 × 10–15','calf'],['Cable Crunch','3 × 12–15','crunch']]}
];
const BY={};DAYS.forEach(d=>d.ex.forEach((e,i)=>BY[`d${d.n}-${i}`]={day:d,name:e[0],sets:e[1],key:e[2]}));
const KEY='split4-done';
let done={};try{done=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
let fDay=0,sel=Object.keys(BY).find(id=>!done[id])||'d1-0';
const $=id=>document.getElementById(id), list=$('list'), q=$('q');
const idsOf=d=>d.ex.map((_,i)=>`d${d.n}-${i}`);
const C=2*Math.PI*18;

$('tiles').onclick=e=>{const b=e.target.closest('.tile');if(!b)return;const n=+b.dataset.n;fDay=fDay===n?0:n;render();};
$('all').onclick=()=>{fDay=0;render();};
q.oninput=render;

function render(){
  $('tiles').innerHTML=DAYS.map(d=>{const ids=idsOf(d),n=ids.filter(id=>done[id]).length;
    return `<button class="tile" data-n="${d.n}" aria-pressed="${fDay===d.n}" aria-label="Day ${d.n} ${d.name}, ${n} of ${ids.length} done"><svg viewBox="0 0 44 44"><circle class="trk" cx="22" cy="22" r="18" fill="none" stroke-width="5"/><circle class="val" cx="22" cy="22" r="18" fill="none" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-n/ids.length)}"${n?'':' opacity="0"'}/></svg><small>Day ${d.n}</small><b>${d.name}</b><small>${n}/${ids.length}</small></button>`}).join('');
  $('fl').textContent=fDay?`Showing Day ${fDay} · ${DAYS[fDay-1].name}`:'Showing all days';$('all').hidden=!fDay;
  const s=q.value.trim().toLowerCase();let h='';
  DAYS.forEach(d=>{
    if(fDay&&fDay!==d.n)return;
    const ids=idsOf(d), shown=ids.filter(id=>!s||BY[id].name.toLowerCase().includes(s));
    if(!shown.length)return;
    const n=ids.filter(id=>done[id]).length, full=n===ids.length;
    h+=`<section class="day"><div class="dh"><button class="dcheck" data-day="${d.n}" aria-pressed="${full}" aria-label="Mark all of Day ${d.n} ${full?'not done':'done'}"></button><div class="dt"><span class="eb">Day ${d.n}</span><h3>${d.name}</h3></div><span class="cnt">${n}/${ids.length}</span></div><ul>`;
    shown.forEach(id=>{const e=BY[id];h+=`<li class="row${sel===id?' sel':''}${done[id]?' done':''}"><input type="checkbox" id="c-${id}" data-id="${id}"${done[id]?' checked':''} aria-label="Done: ${e.name}"><button class="ex" data-id="${id}"><span class="nm">${e.name}</span><span class="sr">${e.sets}</span></button></li>`;});
    h+='</ul></section>';});
  list.innerHTML=h||'<p class="empty">No exercises match that filter.</p>';
  const tot=Object.keys(BY).length, c=Object.keys(BY).filter(id=>done[id]).length;
  $('prog').textContent=`${c} / ${tot} exercises done this week`;$('bar').style.width=(c/tot*100)+'%';
}
list.addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;e.target.checked?done[id]=1:delete done[id];save();render();});
list.addEventListener('click',e=>{
  const ex=e.target.closest('.ex');if(ex){select(ex.dataset.id);return;}
  const dc=e.target.closest('.dcheck');if(dc){const ids=idsOf(DAYS[dc.dataset.day-1]),full=ids.every(id=>done[id]);
    ids.forEach(id=>full?delete done[id]:done[id]=1);save();render();}
});
let armT;$('reset').onclick=function(){
  if(this.classList.contains('arm')){done={};save();render();clearTimeout(armT);this.classList.remove('arm');this.textContent='New week';return;}
  this.classList.add('arm');this.textContent='Tap again to clear';armT=setTimeout(()=>{this.classList.remove('arm');this.textContent='New week';},3000);
};
function select(id){sel=id;const e=BY[id];
  $('capDay').textContent=`Day ${e.day.n} · ${e.day.name}`;$('capName').textContent=e.name;$('capSets').textContent=e.sets+' reps';
  list.querySelectorAll('.row').forEach(r=>r.classList.toggle('sel',r.querySelector('.ex').dataset.id===id));
  if(window.setAnim)setAnim(e.key);
}
render();select(sel);

/* ---------- 3D athlete ---------- */
if(!window.THREE){$('stage').insertAdjacentHTML('beforeend','<p class="msg">The 3D viewer could not load. Check your connection; the checklist still works.</p>');}
else{
const D=Math.PI/180, L=(a,b,s)=>a+(b-a)*s, V=(x,y,z)=>new THREE.Vector3(x,y,z), V2=(x,y)=>new THREE.Vector2(x,y);
const cv=$('cv'), stage=$('stage');
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(), cam=new THREE.PerspectiveCamera(32,1,.1,50);
scene.add(new THREE.HemisphereLight(0xf2f5ff,0x3a3f48,.75));
const sun=new THREE.DirectionalLight(0xffffff,.85);sun.position.set(2.5,5,3.5);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-2.6,right:2.6,top:3,bottom:-1,near:.5,far:14});sun.shadow.bias=-.0006;sun.shadow.radius=4;scene.add(sun);
const rim=new THREE.DirectionalLight(0x8fb0ff,.55);rim.position.set(-3,3,-4);scene.add(rim);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.6},o));
const skin=M(0xc8986f,{roughness:.5}), shirt=M(0x1d232d,{roughness:.85}), shorts=M(0x2b55b8,{roughness:.8}), shoe=M(0xf1f2f4,{roughness:.6}), sole=M(0x23272e),
  hair=M(0x3a2a1c,{roughness:.9}), steel=M(0x8c94a1,{metalness:.7,roughness:.3}), pad=M(0x23272e,{roughness:.75}), iron=M(0x30353d,{metalness:.4,roughness:.45}), plateMat=M(0xc23b32,{roughness:.55}), frameMat=M(0x3c4350,{metalness:.5,roughness:.4});
const sleeveShirt=shirt.clone();sleeveShirt.side=THREE.DoubleSide;const sleeveShorts=shorts.clone();sleeveShorts.side=THREE.DoubleSide;
const floor=new THREE.Mesh(new THREE.CircleGeometry(2.1,64),M(0x4a515c,{roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(2.08,2.14,64),M(0x2b55b8));ring.rotation.x=-Math.PI/2;ring.position.y=.002;scene.add(ring);

const G=()=>new THREE.Group();
const sph=(r,mat,sx=1,sy=1,sz=1)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,24,18),mat);m.scale.set(sx,sy,sz);return m};
function smooth(a,t){const x=Math.min(.9999,Math.max(0,t))*(a.length-1),i=Math.floor(x);let f=x-i;f=f*f*(3-2*f);return a[i]+(a[i+1]-a[i])*f}
/* muscle-shaped limb segment hanging down from its joint: radii sampled top→bottom */
function seg(len,radii,mat,from=0,to=1,caps=true){const pts=[],N=20;
  if(caps)pts.push(V2(0,-to*len-radii[radii.length-1]*.5));
  for(let i=N;i>=0;i--){const t=from+(to-from)*i/N;pts.push(V2(smooth(radii,t),-t*len))}
  if(caps)pts.push(V2(0,-from*len+radii[0]*.5));
  return new THREE.Mesh(new THREE.LatheGeometry(pts,24),mat)}
function limb(parent,pos,l1,l2,r1,r2,ball,sleeve,sleeveTo){
  const a=G();a.position.copy(pos);parent.add(a);a.add(ball,seg(l1,r1,skin));
  if(sleeve)a.add(seg(l1,r1.map(r=>r+.012),sleeve,0,sleeveTo,false));
  const b=G();b.position.y=-l1;a.add(b);b.add(sph(r2[0]*.98,skin),seg(l2,r2,skin));const c=G();c.position.y=-l2;b.add(c);return[a,b,c]}

const root=G();scene.add(root);
root.add(sph(1,shorts,.175,.12,.13));
const glute=sph(.085,shorts,1,1,1);
const spine=G();spine.position.y=.03;root.add(spine);
/* V-taper torso */
const tp=[[0,-.04],[.125,-.02],[.128,.08],[.14,.18],[.17,.28],[.198,.37],[.2,.43],[.15,.5],[.06,.53],[0,.535]].map(p=>V2(p[0],p[1]));
const torso=new THREE.Mesh(new THREE.LatheGeometry(tp,28),shirt);torso.scale.z=.64;spine.add(torso);
[-1,1].forEach(k=>{const p=sph(.085,shirt,1.15,.6,.32);p.position.set(k*.08,.37,.09);spine.add(p)});
const trap=sph(.12,shirt,1.25,.45,.6);trap.position.y=.48;spine.add(trap);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.045,.055,.12,16),skin);neck.position.y=.56;spine.add(neck);
const head=G();head.position.y=.68;spine.add(head);
head.add(sph(.1,skin,.92,1.12,1.02));
const hc=new THREE.Mesh(new THREE.SphereGeometry(.104,24,14,0,Math.PI*2,0,Math.PI*.42),hair);hc.scale.set(.95,1.12,1.06);hc.position.set(0,.012,-.008);head.add(hc);
[-1,1].forEach(k=>{const e=sph(.017,skin);e.position.set(k*.09,-.005,0);head.add(e)});
const nose=sph(.016,skin,1,1.4,1);nose.position.set(0,-.02,.1);head.add(nose);

const ARM1=[.056,.06,.062,.055,.046,.042], ARM2=[.044,.047,.043,.035,.029,.027], LEG1=[.09,.094,.086,.076,.064,.054], LEG2=[.054,.064,.062,.048,.036,.032];
const delt=()=>sph(.07,shirt,1,1.08,1);
const[shL,elL,handL]=limb(spine,V(.215,.44,0),.29,.26,ARM1,ARM2,delt(),sleeveShirt,.32),[shR,elR,handR]=limb(spine,V(-.215,.44,0),.29,.26,ARM1,ARM2,delt(),sleeveShirt,.32);
shL.rotation.order=shR.rotation.order='ZXY';
[handL,handR].forEach(h=>{const f=sph(.04,skin,.85,1.15,.8);f.position.y=-.02;h.add(f)});
const hipBall=()=>sph(.098,shorts);
const[hipL,knL,anL]=limb(root,V(.1,-.03,0),.44,.44,LEG1,LEG2,hipBall(),sleeveShorts,.42),[hipR,knR,anR]=limb(root,V(-.1,-.03,0),.44,.44,LEG1,LEG2,hipBall(),sleeveShorts,.42);
[-1,1].forEach(k=>{const g=sph(.088,shorts);g.position.set(k*.085,-.04,-.07);root.add(g)});
const toeL=G();
[anL,anR].forEach(a=>{const s=new THREE.Mesh(new THREE.CapsuleGeometry(.045,.13,6,14),shoe);s.rotation.x=Math.PI/2;s.scale.set(1,1,.8);s.position.set(0,-.035,.05);a.add(s);
  const so=new THREE.Mesh(new THREE.BoxGeometry(.09,.016,.23),sole);so.position.set(0,-.07,.05);a.add(so)});
toeL.position.set(0,-.078,.15);anL.add(toeL);

function applyPose(p){
  root.position.set(0,p.y??.96,p.z??0);root.rotation.x=(p.rx||0)*D;spine.rotation.x=(p.lean||0)*D;head.rotation.x=(p.nod||0)*D;
  const sh=p.sh||[4,7,0],el=p.el??10,hp=p.hip||0,kn=p.knee||0;
  shL.rotation.set(-sh[0]*D,sh[2]*D,sh[1]*D);shR.rotation.set(-sh[0]*D,-sh[2]*D,-sh[1]*D);
  elL.rotation.x=elR.rotation.x=-el*D;
  hipL.rotation.x=-(p.hipL??hp)*D;hipR.rotation.x=-(p.hipR??hp)*D;knL.rotation.x=(p.kneeL??kn)*D;knR.rotation.x=(p.kneeR??kn)*D;
  anL.rotation.x=anR.rotation.x=(p.ank||0)*D;
}

/* equipment */
const box=(w,h,d,mat,x,y,z,rx=0)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.rotation.x=rx;return m};
function cushion(w,h,d,x,y,z,rx=0){const g=G();g.position.set(x,y,z);g.rotation.x=rx;const c=new THREE.Mesh(new THREE.CapsuleGeometry(h/2,w-h,6,14),pad);c.rotation.z=Math.PI/2;c.scale.z=d/h;g.add(c);return g}
const post=(x,z,h)=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.028,.028,h,12),frameMat);m.position.set(x,h/2,z);return m};
function bench(back){const g=G();g.add(cushion(.36,.08,.42,0,.41,.1),box(.08,.37,.08,frameMat,0,.185,.1),box(.42,.03,.52,frameMat,0,.015,.1));
  const p=G();p.position.set(0,.44,-.17);p.rotation.x=-back*D;p.add(cushion(.32,.07,.66,0,.34,0,Math.PI/2));g.add(p);return[g];}
const tower=z=>[post(.32,z,2.3),post(-.32,z,2.3),box(.7,.06,.06,frameMat,0,2.3,z),box(.7,.06,.06,frameMat,0,.05,z),box(.5,.6,.08,iron,0,.4,z)];
const frame3=(z,h,w)=>[post(w,z,h),post(-w,z,h),box(w*2+.06,.05,.05,frameMat,0,h,z)];
function rod(len,r,mat){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,len,20),mat);m.rotation.z=Math.PI/2;return m}
function dumbbell(){const g=G();g.add(rod(.17,.014,steel));[-.08,.08].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.055,.055,.05,6),iron);p.rotation.z=Math.PI/2;p.position.x=x;g.add(p)});g.position.y=-.03;return g}
function handle(){const h=rod(.12,.02,pad);h.position.y=-.03;return h}
function barMesh(len,plates){const g=G();g.add(rod(len,.014,steel));if(plates)[-1,1].forEach(k=>{const p=rod(.045,.21,plateMat);p.position.x=k*(len/2-.13);g.add(p);const c=rod(.06,.03,steel);c.position.x=k*(len/2-.08);g.add(c)});return g}
const PD=V(0,Math.SQRT1_2,Math.SQRT1_2);
function legPressGear(){const g=G();g.position.set(0,.55,0);g.rotation.x=-45*D;g.add(cushion(.4,.08,.42,0,-.13,.04),cushion(.36,.07,.72,0,.36,-.17,Math.PI/2));
  return[g,box(.44,.42,.42,frameMat,0,.21,-.12),...[.32,-.32].map(x=>box(.05,.05,1.1,steel,x,.55+.707*1.05,.707*1.05,-45*D))];}

const A={

 smith:{bar:{len:1.6,plates:true},gear:()=>[...bench(40),post(.8,.4,2.3),post(-.8,.4,2.3)],pose:s=>({...seat,lean:-40,sh:[L(22,85,s),L(84,22,s),0],el:L(95,5,s)})},
 chestPress:{grip:handle,gear:()=>[...bench(4),...frame3(-.34,1.55,.4)],pose:s=>({...seat,lean:-4,sh:[L(15,85,s),L(85,10,s),0],el:L(95,5,s)})},
 shoulderPress:{grip:dumbbell,gear:()=>bench(4),pose:s=>({...seat,lean:-4,sh:[0,L(90,165,s),90],el:L(95,8,s)})},

 ohExt:{grip:handle,plant:'ank',cable:[0,.35,-.62],gear:()=>tower(-.7),pose:s=>({lean:12,knee:8,hip:4,sh:[168,10,0],el:L(135,10,s)})},
 pushdown:{bar:{len:.5},plant:'ank',cable:[0,2.15,.5],gear:()=>tower(.62),pose:s=>({lean:10,knee:6,hip:3,sh:[14,6,0],el:L(100,6,s)})},
 curlPush:{bar:{len:.5},plant:'ank',period:5.2,cable:t=>t<.5?[0,.14,.55]:[0,2.15,.5],gear:()=>tower(.62),
   pose:(s,t)=>{const u=.5-.5*Math.cos(4*Math.PI*t);return t<.5?{lean:2,sh:[10,6,0],el:L(8,135,u)}:{lean:10,knee:6,hip:3,sh:[14,6,0],el:L(100,6,u)}}},
 pullup:{lock:[2.25,0],target:1.35,dist:5,gear:()=>{const b=rod(1.5,.018,steel);b.position.set(0,2.25,0);return[b,...frame3(-.1,2.4,.75)]},

 pulldown:{bar:{len:1.2},cable:[0,2.42,-.02],target:1.1,dist:4.6,gear:()=>[...bench(10),cushion(.42,.08,.12,0,.63,.3),post(0,-.42,2.45),box(.06,.06,.44,frameMat,0,2.45,-.2)],
   pose:s=>({...seat,lean:-10,sh:[0,L(165,50,s),90],el:L(5,120,s)})},
 csRow:{grip:dumbbell,gear:()=>[cushion(.34,.08,.62,0,1.12,.37,Math.PI/2+45*D),post(0,.55,.98),box(.4,.03,.5,frameMat,0,.015,.35)],pose:s=>({y:.95,lean:45,knee:12,hip:6,sh:[L(45,-15,s),12,0],el:L(5,62,s)})},
 rearFly:{grip:dumbbell,plant:'ank',pose:s=>({z:-.08,lean:68,knee:15,hip:8,nod:-25,sh:[L(66,4,s),L(8,82,s),0],el:15})},
 inclineCurl:{grip:dumbbell,gear:()=>bench(45),pose:s=>({...seat,lean:-45,sh:[-45,6,0],el:L(5,130,s)})},

 pecDeck:{grip:handle,gear:()=>[...bench(4),...frame3(-.34,1.6,.45)],pose:s=>({...seat,lean:-4,sh:[L(5,82,s),88,25],el:25})},
 squat:{backBar:true,plant:'ank',gear:()=>[post(.8,-.12,2.3),post(-.8,-.12,2.3),box(1.66,.05,.05,frameMat,0,2.3,-.12)],
   pose:s=>({z:L(0,-.06,s),lean:L(3,28,s),hip:L(0,100,s),knee:L(0,112,s),ank:L(0,-22,s),nod:L(0,-15,s),sh:[-20,72,90],el:125})},
 bss:{grip:dumbbell,plant:'ank',rearBench:true,pose:s=>({lean:L(4,14,s),hipL:L(20,82,s),kneeL:L(20,92,s),hipR:L(-12,-18,s),kneeR:L(70,105,s),sh:[6,8,0],el:5})},
 calf:{grip:dumbbell,plant:'toe',step:true,pose:s=>({ank:L(-14,32,s),sh:[4,8,0],el:5})},
 crunch:{bar:{len:.22},plant:'knee',yaw:1.5,cable:[0,2.2,.62],gear:()=>[...tower(.72),cushion(.5,.05,.3,0,.025,-.08)],
   pose:s=>({lean:L(12,72,s),hip:L(0,18,s),knee:92,nod:L(0,25,s),sh:[L(155,140,s),14,0],el:145})}
};
const PL={ank:[anL,.088],toe:[toeL,.1],knee:[knL,.075]};

let cur=A.lateral, extras=[], barObj=null, plateObj=null;
const cableGeo=new THREE.BufferGeometry();cableGeo.setAttribute('position',new THREE.Float32BufferAttribute(6,3));
const cable=new THREE.Line(cableGeo,new THREE.LineBasicMaterial({color:0x9aa3b2}));cable.frustumCulled=false;
const pulley=sph(.05,steel);
const vL=V(),vR=V(),mid=V(),dir=V(),X=V(1,0,0);
function add(o,parent=scene){parent.add(o);extras.push(o)}
window.setAnim=key=>{
  extras.forEach(o=>o.parent&&o.parent.remove(o));extras=[];barObj=plateObj=null;cur=A[key];
  (cur.gear?cur.gear():[]).forEach(o=>add(o));
  (cur.rootGear?cur.rootGear():[]).forEach(o=>add(o,root));
  if(cur.grip){add(cur.grip(),handL);add(cur.grip(),handR)}
  if(cur.bar){barObj=barMesh(cur.bar.len,cur.bar.plates);add(barObj)}
  if(cur.backBar){const b=barMesh(1.6,true);b.position.set(0,.47,-.12);add(b,spine)}
  if(cur.cable){add(cable);add(pulley)}
  if(cur.plate){plateObj=box(.6,.5,.04,steel,0,0,0,-45*D);add(plateObj)}
  if(cur.legPad){const p=rod(.42,.045,pad);p.position.set(-.1,-.37,.085*cur.legPad);add(p,knL)}
  if(cur.step){frame(0);toeL.getWorldPosition(vL);add(box(.6,.1,.18,frameMat,0,.05,vL.z-.02))}
  if(cur.rearBench){frame(.3);anR.getWorldPosition(vR);const h=vR.y-.05;add(cushion(.36,.08,.4,-.05,h-.04,vR.z-.06));add(box(.08,h-.08,.08,frameMat,-.05,(h-.08)/2,vR.z-.06))}
  scene.traverse(o=>{if(o.isMesh&&o!==floor&&o!==ring)o.castShadow=true});
  if(cur.yaw!=null)yaw=cur.yaw;
  t0=performance.now();
};
function frame(t){
  const s=.5-.5*Math.cos(2*Math.PI*t);applyPose(cur.pose(s,t));root.updateMatrixWorld(true);
  if(cur.plant){const[o,y]=PL[cur.plant];o.getWorldPosition(vL);root.position.y+=y-vL.y;root.updateMatrixWorld(true)}
  const hands=()=>{handL.getWorldPosition(vL);handR.getWorldPosition(vR);mid.addVectors(vL,vR).multiplyScalar(.5)};hands();
  if(cur.lock){root.position.y+=cur.lock[0]-mid.y;root.position.z+=cur.lock[1]-mid.z;root.updateMatrixWorld(true);hands()}
  if(barObj){barObj.position.copy(mid);dir.subVectors(vL,vR).normalize();barObj.quaternion.setFromUnitVectors(X,dir)}
  if(cur.cable){const p=typeof cur.cable==='function'?cur.cable(t):cur.cable;pulley.position.set(p[0],p[1],p[2]);
    cableGeo.attributes.position.array.set([mid.x,mid.y,mid.z,p[0],p[1],p[2]]);cableGeo.attributes.position.needsUpdate=true}
  if(plateObj){anL.getWorldPosition(vL);anR.getWorldPosition(vR);plateObj.position.addVectors(vL,vR).multiplyScalar(.5).addScaledVector(PD,.08)}
}

let yaw=.65,drag=null;
cv.addEventListener('pointerdown',e=>{drag=e.clientX;cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(drag==null)return;yaw-=(e.clientX-drag)*.01;drag=e.clientX});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>drag=null));

function size(){const w=stage.clientWidth,h=stage.clientHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(size).observe(stage);size();

let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,t0=performance.now(),pauseT=.25;
const pb=$('play');const syncBtn=()=>{pb.textContent=playing?'❚❚':'▶';pb.setAttribute('aria-label',playing?'Pause animation':'Play animation')};syncBtn();
pb.onclick=()=>{const per=(cur.period||2.6)*1000;if(playing)pauseT=((performance.now()-t0)/per)%1;else t0=performance.now()-pauseT*per;playing=!playing;syncBtn()};
window.__frame=t=>{frame(t);const ty=cur.target??.95,r=cur.dist??4.3;cam.position.set(Math.sin(yaw)*r,ty+.7,Math.cos(yaw)*r);cam.lookAt(0,ty,0);R.render(scene,cam)};
function loop(now){
  const per=(cur.period||2.6)*1000;window.__frame(playing?((now-t0)/per)%1:pauseT);requestAnimationFrame(loop);
}
setAnim(BY[sel].key);requestAnimationFrame(loop);
}
